# Publishes a release: the ate-env-api and ate-env-guest images and the
# OpenHands runtime layer to GitHub Container Registry, pinned by digest and
# signed, and the ate-env CLI with the two ate-env digests baked in as its
# defaults, so a release binary deploys without naming any image of this repo.
# Runs on a v* tag, or by hand from an existing tag (to republish; the run must
# start from the tag ref). See docs/release.md.
#
# Actions are pinned by commit SHA (the version is in the trailing comment),
# expressions reach shell only through env, and the Go module cache is off:
# the organization's workflow security scan (zizmor) requires all three.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish images and assets for (e.g. v0.1.0)"
        required: true
        type: string

# One publish per tag at a time; a second run for the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  # ghcr.io/<org>/<repo>/<image>; the images are linked to this repository.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  KO_DEFAULTPLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: Publish images, CLI and release assets
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    permissions:
      contents: write # release assets and notes
      packages: write # ghcr.io
      id-token: write # cosign keyless signing
    steps:
      # A manual run must start from the tag ("Use workflow from: <tag>"). The
      # signature identity names the ref the workflow runs from, and the verify
      # command in docs/release.md accepts only refs/tags/.
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ "${GITHUB_REF}" != "refs/tags/${tag}" ]]; then
            echo "run this workflow from the tag ${tag} (Use workflow from: ${tag}), not from ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release build must not consume a cache another run could seed

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The OpenHands runtime layer (integrations/openhands/layer) is a Dockerfile
      # build, not a Go binary, thus buildx builds it. QEMU runs its linux/arm64
      # stages on the amd64 runner; the binfmt image is pinned by digest.
      #
      # Order: the slow layer build runs first and pushes by digest only, with no
      # tag. The ko images are pushed next and signed at once, together with the
      # layer, and the layer gets its tag only after the signature exists. Thus a
      # failed layer build leaves no tag and no release behind, and no tag points
      # at an image without a signature longer than the push-to-sign step.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the OpenHands layer (by digest, no tag yet)
        id: layer
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag carries the agent-server version the layer is locked to; the
          # build checks that the installed agent-server, sdk and tools match it.
          version=$(sed -n 's/^openhands-agent-server==\([0-9][0-9.]*\)$/\1/p' integrations/openhands/layer/requirements.in)
          if [[ -z "${version}" ]]; then
            echo "no openhands-agent-server==<version> line in integrations/openhands/layer/requirements.in" >&2
            exit 1
          fi
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          # --provenance=false: a plain image index, like the ko images; the cosign
          # signature below records where the image comes from. push-by-digest:
          # the index is pushed without a tag; "Tag the OpenHands layer" adds it.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "AGENT_SERVER_VERSION=${version}" \
            --provenance=false \
            --output "type=image,name=${IMAGE_PREFIX}/oh-agent-server-layer,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file layer-metadata.json \
            integrations/openhands/layer
          digest=$(jq -r '."containerimage.digest"' layer-metadata.json)
          if [[ "${digest}" != sha256:* ]]; then
            echo "no image digest in the buildx metadata: ${digest}" >&2
            exit 1
          fi
          layer="${IMAGE_PREFIX}/oh-agent-server-layer@${digest}"
          echo "layer=${layer}" >> "$GITHUB_OUTPUT"
          echo "layer_tag=${IMAGE_PREFIX}/oh-agent-server-layer:${version}-${TAG}" >> "$GITHUB_OUTPUT"
          echo "oh-agent-server-layer: ${layer}"

      - name: Build and push the images
        id: images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          api=$(KO_DOCKER_REPO="${IMAGE_PREFIX}/ate-env-api" ko build --bare --tags "${TAG},latest" ./cmd/ate-env-api)
          guest=$(KO_DOCKER_REPO="${IMAGE_PREFIX}/ate-env-guest" ko build --bare --tags "${TAG},latest" ./cmd/ate-env-guest)
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "guest=${guest}" >> "$GITHUB_OUTPUT"
          echo "ate-env-api:   ${api}"
          echo "ate-env-guest: ${guest}"

      - name: Sign the images (keyless, bound to this workflow's identity)
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          GUEST_IMAGE: ${{ steps.images.outputs.guest }}
          LAYER_IMAGE: ${{ steps.layer.outputs.layer }}
        run: cosign sign --yes "$API_IMAGE" "$GUEST_IMAGE" "$LAYER_IMAGE"

      # A single source makes imagetools copy the index as is: the tag points at
      # the signed digest.
      - name: Tag the OpenHands layer
        env:
          LAYER_IMAGE: ${{ steps.layer.outputs.layer }}
          LAYER_TAG: ${{ steps.layer.outputs.layer_tag }}
        run: docker buildx imagetools create --tag "$LAYER_TAG" "$LAYER_IMAGE"

      - name: Build the CLI with the image digests as defaults
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          GUEST_IMAGE: ${{ steps.images.outputs.guest }}
          LAYER_IMAGE: ${{ steps.layer.outputs.layer }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X main.version=${TAG} -X main.defaultAPIImage=${API_IMAGE} -X main.defaultGuestImage=${GUEST_IMAGE}"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
                -o "dist/ate-env_${TAG}_${os}_${arch}" ./cmd/ate-env
            done
          done
          {
            echo "ate-env-api=${API_IMAGE}"
            echo "ate-env-guest=${GUEST_IMAGE}"
            echo "oh-agent-server-layer=${LAYER_IMAGE}"
          } > "dist/images_${TAG}.txt"
          (cd dist && sha256sum ./* > "SHA256SUMS_${TAG}.txt")
          ls -l dist

      - name: Publish the release assets and record the digests in the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          GUEST_IMAGE: ${{ steps.images.outputs.guest }}
          LAYER_IMAGE: ${{ steps.layer.outputs.layer }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          # The API can hand the body back with CRLF line endings; strip them or the
          # block below is appended twice on republish instead of replaced.
          existing=$(gh release view "$TAG" --json body --jq .body | tr -d '\r')
          # Replace a previous images block (republish) rather than append twice.
          existing=$(printf '%s\n' "$existing" | awk '/^## Images$/{skip=1} skip&&/^## /&&!/^## Images$/{skip=0} !skip')
          {
            printf '%s\n\n' "$existing"
            echo "## Images"
            echo
            echo "Pinned by digest and signed with cosign (keyless, GitHub Actions OIDC):"
            echo
            echo "- \`${API_IMAGE}\`"
            echo "- \`${GUEST_IMAGE}\`"
            echo "- \`${LAYER_IMAGE}\`"
            echo
            echo "The \`ate-env\` binaries attached to this release default \`manifest --api-image\` and \`manifest template --guest-image\` to the first two digests."
            echo "The third is the OpenHands runtime layer, for \`ate-env manifest template --layer oh=${LAYER_IMAGE}=/opt/oh\` (see \`integrations/openhands/README.md\`)."
            echo
            echo '```bash'
            echo "cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO}/\.github/workflows/release\.yaml@refs/tags/' ${GUEST_IMAGE}"
            echo '```'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
