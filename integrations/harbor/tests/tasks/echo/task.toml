schema_version = "1.4"

[task]
name = "ate-env-harbor/echo"
version = "1.0.0"
authors = []
keywords = ["test"]

[metadata]
author_name = "sandboxenv-rl"
difficulty = "easy"
category = "test"
tags = ["trivial"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

# A prebuilt, digest-pinned image (ate-env runs images by digest only). The
# files under environment/ are uploaded to workdir after start, as Harbor
# does for prebuilt-image tasks without a Dockerfile.
[environment]
docker_image = "alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"
cpus = 1
memory_mb = 512
workdir = "/app"
