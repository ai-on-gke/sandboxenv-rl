schema_version: v1
name: qwen3-1.7b-verl
description: >
  End-to-end real RL training benchmark running Qwen3-1.7B agentic GRPO with
  verl.experimental.fully_async_policy across two 8-GPU nodes against
  ate-env-api sandboxes (PR #112).
seed: 42
sut:
  namespace: ate-env
  template: default-template
  server_addr: ate-env-api.ate-env.svc:7777
  storage_backend: gcs
  pool_enabled: true
  pool_size_per_image: 16
  max_active_pods: 64
jobs:
  - name: verl-qwen3-1p7b-fully-async
    mode: real
    priority: 100
    weight: 1.0
    trainer_manifest: examples/Qwen3-1.7B-verl/job-fully-async.yaml
    trace_mode: trace
    env_vars:
      MODEL_ID: Qwen/Qwen3-1.7B
      NNODES: "2"
      NGPUS_TRAIN: "8"
      NGPUS_ROLLOUT: "8"
      LOCAL_UPDATES: "24"
      PPO_MINI_BATCH: "16"
      N_SAMPLES: "4"
window:
  warmup_steps: 1
  cooldown_steps: 0
