# Fully-async disaggregated run across TWO GPU nodes: a Ray head pod (runs the driver) and a Ray
# worker pod, each taking a whole 8-GPU node. Required pod anti-affinity keeps them on different
# hosts; verl's trainer pool and rollout pool are each sized to a full node (8 GPUs, STRICT_PACK
# placement groups), so the trainer lands on one machine and the vLLM rollout engines on the other.
# deploy.sh fills the node selector (GPU_POOL) and extra tolerations (GPU_TOLERATIONS) placeholders below.
apiVersion: v1
kind: Service
metadata: {name: verl-qwen3-1p7b-fully-async-head, namespace: default}
spec:
  clusterIP: None
  selector: {app: verl-qwen3-1p7b-fully-async, role: head}
  ports:
  - {name: gcs, port: 6379}
---
apiVersion: batch/v1
kind: Job
metadata: {name: verl-qwen3-1p7b-fully-async, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: verl-qwen3-1p7b-fully-async, role: head}}
    spec:
      restartPolicy: Never
      nodeSelector: {__GPU_NODE_SELECTOR__}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      __GPU_EXTRA_TOLERATIONS__
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector: {matchLabels: {app: verl-qwen3-1p7b-fully-async}}
      containers:
      - name: trainer
        image: verlai/verl:vllm020.dev2
        command: ["/bin/bash", "-c", "bash /workspace/cfg/run_fully_async.sh"]
        ports: [{containerPort: 6379}]
        env:
        - {name: ROLE, value: "head"}
        - {name: NNODES, value: "2"}
        - {name: NGPUS_TRAIN, value: "8"}       # trainer pool = one whole node
        - {name: NGPUS_ROLLOUT, value: "8"}     # rollout pool = the other whole node
        - {name: LOCAL_UPDATES, value: "24"}       # 4 smoke, 24 performance numbers (12 logged steps), 468 full (one epoch); see run_fully_async.sh
        - {name: MODEL_ID, value: "Qwen/Qwen3-1.7B"}
        - {name: NODE_WAIT_S, value: "3600"}       # how long the head waits for the worker node to join
        resources:
          requests: {cpu: "48", memory: "300Gi", nvidia.com/gpu: 8}
          limits:   {memory: "600Gi", nvidia.com/gpu: 8}
        volumeMounts:
        - {name: cfg, mountPath: /workspace/cfg}
        - {name: work, mountPath: /workspace}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: cfg
        configMap: {name: verl-qwen3-1p7b-fully-async, defaultMode: 0755}
      - name: work
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 64Gi}
---
apiVersion: batch/v1
kind: Job
metadata: {name: verl-qwen3-1p7b-fully-async-worker, namespace: default}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: verl-qwen3-1p7b-fully-async, role: worker}}
    spec:
      restartPolicy: Never
      nodeSelector: {__GPU_NODE_SELECTOR__}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      __GPU_EXTRA_TOLERATIONS__
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector: {matchLabels: {app: verl-qwen3-1p7b-fully-async}}
      containers:
      - name: worker
        image: verlai/verl:vllm020.dev2
        command: ["/bin/bash", "-c", "bash /workspace/cfg/run_fully_async.sh"]
        env:
        - {name: ROLE, value: "worker"}
        - {name: RAY_HEAD_HOST, value: "verl-qwen3-1p7b-fully-async-head.default.svc"}
        - {name: MODEL_ID, value: "Qwen/Qwen3-1.7B"}
        resources:
          requests: {cpu: "48", memory: "300Gi", nvidia.com/gpu: 8}
          limits:   {memory: "600Gi", nvidia.com/gpu: 8}
        volumeMounts:
        - {name: cfg, mountPath: /workspace/cfg}
        - {name: work, mountPath: /workspace}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: cfg
        configMap: {name: verl-qwen3-1p7b-fully-async, defaultMode: 0755}
      - name: work
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 64Gi}
