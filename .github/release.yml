# Categories for GitHub's automatically generated release notes
# (repos/{owner}/{repo}/releases/generate-notes). See docs/release.md.
#
# GitHub places each PR in the FIRST category it matches, and labels within a
# category are OR'd:
#   - Bug Fixes before feature areas, so a bug fix with an area label is listed
#     as a bug fix.
#   - Area sections exclude documentation and dependency updates so those fall
#     through to their own sections.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: "Bug Fixes"
      labels:
        - bug
    - title: "Core Runtime, CLI & Substrate"
      labels:
        - go
        - substrate
        - api
        - guest
      exclude:
        labels: [documentation, dependencies]
    - title: "Python SDK & Fleet"
      labels:
        - python-sdk
        - python
      exclude:
        labels: [documentation, dependencies]
    - title: "Enhancements"
      labels:
        - enhancement
      exclude:
        labels: [documentation, dependencies]
    - title: "Dependencies"
      labels:
        - dependencies
    - title: "Documentation"
      labels:
        - documentation
    - title: "Other Changes"
      labels:
        - "*"
